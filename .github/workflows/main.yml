name: Build Caddy + Cloudflare

on:
  schedule:
    - cron: "0 5 * * *"   # diario 05:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Reconstruir aunque ya exista"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: docker.io/rpsa/caddy-cloudflare

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Última versión de caddy en Docker Hub
        id: ver
        run: |
          VER=$(curl -s "https://hub.docker.com/v2/repositories/library/caddy/tags?page_size=100&name=builder" \
            | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-builder$' \
            | sed 's/-builder//' | sort -V | tail -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Caddy $VER"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: ¿Ya está construida?
        id: check
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.ver.outputs.version }}" >/dev/null 2>&1 \
             && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: CADDY_VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
